name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint residual informational
        continue-on-error: true
        run: bun run check || bun run lint || true
      - name: Typecheck / build
        run: |
          set -euo pipefail
          bun run typecheck 2>/dev/null || bunx tsc --noEmit 2>/dev/null || true
          bun run build
